name: Backend Tests and Coverage

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'rmp/backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'rmp/backend/**'
      - '.github/workflows/backend-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: [3.9, 3.10, 3.11]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('rmp/backend/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      working-directory: ./rmp/backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Set up test environment
      working-directory: ./rmp/backend
      run: |
        export SECRET_KEY=test-secret-key-for-github-actions
        export DATABASE_URL=sqlite:///./test.db
    
    - name: Run tests with pytest
      working-directory: ./rmp/backend
      run: |
        python -m pytest tests/ \
          --cov=. \
          --cov-report=xml \
          --cov-report=term-missing \
          --cov-fail-under=70 \
          -v
    
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./rmp/backend/coverage.xml
        flags: backend
        name: backend-coverage
        fail_ci_if_error: false
    
    - name: Upload coverage artifact
      uses: actions/upload-artifact@v3
      if: matrix.python-version == '3.10'
      with:
        name: coverage-report
        path: rmp/backend/htmlcov/
    
    - name: Comment PR with coverage
      if: github.event_name == 'pull_request' && matrix.python-version == '3.10'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const path = './rmp/backend/coverage.xml';
          
          if (fs.existsSync(path)) {
            const coverage = fs.readFileSync(path, 'utf8');
            const match = coverage.match(/line-rate="([0-9.]+)"/);
            
            if (match) {
              const rate = (parseFloat(match[1]) * 100).toFixed(2);
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## 📊 Backend Test Coverage Report\n\n**Coverage**: ${rate}%\n\n✅ Tests passed for Python ${{ matrix.python-version }}`
              });
            }
          }
    
  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: 3.10
    
    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort mypy
    
    - name: Run Black (code formatter)
      working-directory: ./rmp/backend
      run: black --check --diff .
    
    - name: Run isort (import sorter)
      working-directory: ./rmp/backend
      run: isort --check-only --diff .
    
    - name: Run flake8 (linter)
      working-directory: ./rmp/backend
      run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
    
    - name: Run mypy (type checker)
      working-directory: ./rmp/backend
      run: mypy . --ignore-missing-imports || true  # Allow mypy to fail for now
