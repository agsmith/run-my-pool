name: Build Frontend Docker Image
on:
  push:
    branches:
      - main
    paths:
      - 'rmp/frontend/**' # Replace 'my-subdirectory' with your target directory
  pull_request:
    branches:
      - main
    paths:
      - 'rmp/frontend/**' # Replace 'my-subdirectory' with your target directory

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1 # Replace with your AWS region

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: runmypool-frontend # Replace with your ECR repository name
          IMAGE_TAG: ${{ github.sha }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: us-east-1
        run: |
          cd rmp/ # Specify the subdirectory for the build context
          ./build-and-push-frontend.sh
          aws ecs update-service --cluster run-my-pool-cluster --service runmypool-frontend-service --force-new-deployment