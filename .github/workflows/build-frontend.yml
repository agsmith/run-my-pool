name: Build and Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'rmp/frontend/**'
      - '.github/workflows/build-frontend.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'rmp/frontend/**'
      - '.github/workflows/build-frontend.yml'

permissions:
  contents: read

jobs:
  test:
    name: Run frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rmp/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: rmp/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --ci --passWithNoTests

      - name: Lint and build
        run: |
          npm run lint
          npm run build

      - name: Audit dependencies
        run: npm audit

  application-e2e:
    name: Run application payment E2E tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rmp/frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: rmp/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        timeout-minutes: 5
        run: npx playwright install chromium
      - name: Run application E2E tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: payment-e2e-report
          path: rmp/frontend/playwright-report
          retention-days: 7

  build-and-deploy:
    name: Build, push, and deploy
    runs-on: ubuntu-latest
    needs: [test, application-e2e]
    # Only deploy on pushes to main — not on PRs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64  # v2.1.6

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: runmypool-frontend
          IMAGE_TAG: ${{ github.sha }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: us-east-1
          NEXT_PUBLIC_CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
        run: |
          cd rmp/
          echo "N" | ./build-and-push-frontend.sh
          aws ecs update-service --cluster run-my-pool-cluster --service runmypool-frontend-service --force-new-deployment
