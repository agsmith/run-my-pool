name: Build and Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'rmp/backend/**'
      - '.github/workflows/build-backend.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'rmp/backend/**'
      - '.github/workflows/build-backend.yml'

permissions:
  contents: read

jobs:
  test:
    name: Run backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rmp/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: rmp/backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install --require-hashes -r requirements-dev.txt

      - name: Run tests
        env:
          DATABASE_URL: sqlite:///./test.db
          SECRET_KEY: ci-test-secret-key
        run: python -m pytest tests/ -q --tb=short

      - name: Audit dependencies
        run: pip-audit --require-hashes -r requirements-dev.txt

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          files: rmp/backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  mysql-integration:
    name: MySQL updater integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rmp/backend

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: runmypool_test
          MYSQL_USER: runmypool_test
          MYSQL_PASSWORD: testpassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -prootpassword"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: rmp/backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install --require-hashes -r requirements-dev.txt

      - name: Run updater tests against MySQL 8.4
        env:
          DATABASE_URL: sqlite:///./test.db
          SECRET_KEY: ci-test-secret-key
          MYSQL_INTEGRATION_URL: mysql+mysqlconnector://runmypool_test:testpassword@127.0.0.1:3306/runmypool_test
        run: python -m pytest tests/test_result_updater_mysql.py -q --tb=short --no-cov

  updater-container-smoke:
    name: Result updater container smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build production backend image
        run: docker build -t runmypool-backend:smoke rmp/backend

      - name: Run production updater command
        run: >-
          docker run --rm
          -e DATABASE_URL=sqlite:////tmp/result-updater-smoke.db
          -e SECRET_KEY=container-smoke-secret
          runmypool-backend:smoke
          sh -c "python -c 'from database import engine; from models import Base; Base.metadata.create_all(engine)'
          && python -m result_updater --run-id container-smoke"

  build-and-deploy:
    name: Build, push, and deploy
    runs-on: ubuntu-latest
    needs: [test, mysql-integration, updater-container-smoke]
    # Only deploy on pushes to main — not on PRs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64  # v2.1.6

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: runmypool-backend
          IMAGE_TAG: ${{ github.sha }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: us-east-1
        run: |
          cd rmp/
          echo "N" | ./build-and-push-backend.sh
          aws ecs update-service --cluster run-my-pool-cluster --service runmypool-backend-service --force-new-deployment

      - name: Register immutable result updater revision
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: runmypool-backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if ! aws ecs describe-task-definition --task-definition runmypool-results-updater >/dev/null 2>&1; then
            echo "Result updater infrastructure is not deployed yet; skipping task revision registration."
            exit 0
          fi

          aws ecs describe-task-definition \
            --task-definition runmypool-results-updater \
            --query taskDefinition > /tmp/result-updater-task.json

          jq \
            --arg image "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            --arg revision "$IMAGE_TAG" \
            'del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                 .compatibilities, .registeredAt, .registeredBy)
             | .containerDefinitions[0].image = $image
             | .containerDefinitions[0].environment =
                 ((.containerDefinitions[0].environment // [])
                  | map(select(.name != "IMAGE_REVISION"))
                  + [{"name":"IMAGE_REVISION","value":$revision}])' \
            /tmp/result-updater-task.json > /tmp/result-updater-task-register.json

          aws ecs register-task-definition \
            --cli-input-json file:///tmp/result-updater-task-register.json
