AWSTemplateFormatVersion: '2010-09-09'
Description: 'NFL Game Updater Lambda Function Infrastructure'

Parameters:
  DatabaseEndpoint:
    Type: String
    Description: RDS MySQL endpoint
    Default: your-rds-endpoint.region.rds.amazonaws.com
  
  DatabaseName:
    Type: String
    Description: Database name
    Default: rmp
  
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID where RDS is located
  
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnet IDs for Lambda function (should have access to RDS)
  
  DatabaseSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group ID that has access to RDS

Resources:
  # Secrets Manager secret for database credentials
  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: rmp-database-credentials
      Description: Database credentials for RMP application
      GenerateSecretString:
        SecretStringTemplate: '{"username": "admin", "dbname": "rmp"}'
        GenerateStringKey: 'password'
        PasswordLength: 32
        ExcludeCharacters: '"@/\'

  # IAM Role for Lambda function
  NFLUpdaterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: nfl-game-updater-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: SecretsManagerAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref DatabaseSecret
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/nfl-game-updater*'

  # Security Group for Lambda function
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: nfl-updater-lambda-sg
      GroupDescription: Security group for NFL Game Updater Lambda function
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS outbound for API calls
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          DestinationSecurityGroupId: !Ref DatabaseSecurityGroupId
          Description: MySQL access to RDS

  # Lambda function
  NFLGameUpdaterFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: nfl-game-updater
      Runtime: python3.11
      Handler: nfl_game_updater.lambda_handler
      Role: !GetAtt NFLUpdaterRole.Arn
      Timeout: 300
      MemorySize: 256
      Description: Updates NFL game results and pool entries
      Code:
        ZipFile: |
          # Placeholder code - replace with actual deployment
          import json
          def lambda_handler(event, context):
              return {'statusCode': 200, 'body': json.dumps('Placeholder function')}
      Environment:
        Variables:
          MYSQL_HOST: !Ref DatabaseEndpoint
          MYSQL_DB: !Ref DatabaseName
          DB_SECRET_NAME: !Ref DatabaseSecret
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds: !Ref SubnetIds

  # CloudWatch Log Group
  NFLUpdaterLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${NFLGameUpdaterFunction}'
      RetentionInDays: 14

  # EventBridge rules to trigger Lambda every 15 minutes during game times
  # Including 1 hour before and after expected game times
  
  # Sunday games: 12:00 PM - 12:30 AM ET next day (17:00 - 05:30 UTC next day)
  NFLUpdaterSundayRule:
    Type: AWS::Events::Rule
    Properties:
      Name: nfl-game-updater-sunday
      Description: Trigger NFL game updater every 15 minutes during Sunday games (including 1hr buffer)
      ScheduleExpression: "cron(0/15 17-23,0-5 ? * SUN *)"
      State: ENABLED
      Targets:
        - Arn: !GetAtt NFLGameUpdaterFunction.Arn
          Id: NFLGameUpdaterSundayTarget

  # Monday Night Football: 7:00 PM - 12:30 AM ET next day (00:00 - 05:30 UTC next day)
  NFLUpdaterMondayRule:
    Type: AWS::Events::Rule
    Properties:
      Name: nfl-game-updater-monday
      Description: Trigger NFL game updater every 15 minutes during Monday Night Football (including 1hr buffer)
      ScheduleExpression: "cron(0/15 0-5 ? * TUE *)"
      State: ENABLED
      Targets:
        - Arn: !GetAtt NFLGameUpdaterFunction.Arn
          Id: NFLGameUpdaterMondayTarget

  # Thursday Night Football: 7:00 PM - 12:30 AM ET next day (00:00 - 05:30 UTC next day)
  NFLUpdaterThursdayRule:
    Type: AWS::Events::Rule
    Properties:
      Name: nfl-game-updater-thursday
      Description: Trigger NFL game updater every 15 minutes during Thursday Night Football (including 1hr buffer)
      ScheduleExpression: "cron(0/15 0-5 ? * FRI *)"
      State: ENABLED
      Targets:
        - Arn: !GetAtt NFLGameUpdaterFunction.Arn
          Id: NFLGameUpdaterThursdayTarget

  # Saturday games: 12:00 PM - 12:30 AM ET next day (17:00 - 05:30 UTC next day)
  NFLUpdaterSaturdayRule:
    Type: AWS::Events::Rule
    Properties:
      Name: nfl-game-updater-saturday
      Description: Trigger NFL game updater every 15 minutes during Saturday games (including 1hr buffer)
      ScheduleExpression: "cron(0/15 17-23,0-5 ? * SAT *)"
      State: ENABLED
      Targets:
        - Arn: !GetAtt NFLGameUpdaterFunction.Arn
          Id: NFLGameUpdaterSaturdayTarget

  # Permissions for EventBridge to invoke Lambda
  NFLUpdaterSundayPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref NFLGameUpdaterFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt NFLUpdaterSundayRule.Arn

  NFLUpdaterMondayPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref NFLGameUpdaterFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt NFLUpdaterMondayRule.Arn

  NFLUpdaterThursdayPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref NFLGameUpdaterFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt NFLUpdaterThursdayRule.Arn

  NFLUpdaterSaturdayPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref NFLGameUpdaterFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt NFLUpdaterSaturdayRule.Arn

  # CloudWatch Alarm for function errors
  NFLUpdaterErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: nfl-game-updater-errors
      AlarmDescription: NFL Game Updater Lambda function errors
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref NFLGameUpdaterFunction
      TreatMissingData: notBreaching

  # CloudWatch Alarm for function duration
  NFLUpdaterDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: nfl-game-updater-duration
      AlarmDescription: NFL Game Updater Lambda function duration
      MetricName: Duration
      Namespace: AWS/Lambda
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 240000  # 4 minutes (240 seconds in milliseconds)
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref NFLGameUpdaterFunction
      TreatMissingData: notBreaching

Outputs:
  LambdaFunctionName:
    Description: Name of the NFL Game Updater Lambda function
    Value: !Ref NFLGameUpdaterFunction
    Export:
      Name: !Sub '${AWS::StackName}-LambdaFunctionName'

  LambdaFunctionArn:
    Description: ARN of the NFL Game Updater Lambda function
    Value: !GetAtt NFLGameUpdaterFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-LambdaFunctionArn'

  DatabaseSecretArn:
    Description: ARN of the database credentials secret
    Value: !Ref DatabaseSecret
    Export:
      Name: !Sub '${AWS::StackName}-DatabaseSecretArn'

  ScheduleRulesArns:
    Description: ARNs of the EventBridge schedule rules
    Value: !Sub 
      - "${SundayArn},${MondayArn},${ThursdayArn},${SaturdayArn}"
      - SundayArn: !GetAtt NFLUpdaterSundayRule.Arn
        MondayArn: !GetAtt NFLUpdaterMondayRule.Arn
        ThursdayArn: !GetAtt NFLUpdaterThursdayRule.Arn
        SaturdayArn: !GetAtt NFLUpdaterSaturdayRule.Arn
    Export:
      Name: !Sub '${AWS::StackName}-ScheduleRulesArns'
